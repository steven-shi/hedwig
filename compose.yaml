name: hedwig
services:
  ai:
    image: hedwig-ai:local
    build:
      context: .
      target: ai
    user: "${HEDWIG_UID:-1000}:${HEDWIG_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: unless-stopped
    environment:
      HEDWIG_LOG_DIR: /logs
    logging: &hedwig_logging
      driver: local
      options:
        max-size: "2m"
        max-file: "3"
    volumes:
      - type: bind
        source: ./config.json
        target: /config/config.json
        read_only: true
        bind:
          create_host_path: false
      - ./prompts:/app/prompts:ro
      - ./logs:/logs
      - ./run:/run/neo
    healthcheck:
      test: ["CMD", "node", "ai/health.mjs"]
      interval: 5s
      timeout: 3s
      retries: 6
    stop_grace_period: 10s
  bridge:
    image: hedwig-bridge:local
    platform: linux/arm64
    build:
      context: .
      target: bridge
    depends_on:
      ai:
        condition: service_healthy
    user: "${HEDWIG_UID:-1000}:${HEDWIG_GID:-1000}"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    restart: "no"
    environment:
      HEDWIG_LOG_DIR: /logs
    logging: *hedwig_logging
    ports:
      - "${HEDWIG_QR_BIND:-127.0.0.1}:${HEDWIG_QR_PORT:-8765}:8765"
    volumes:
      - ./run:/run/neo
      - ./state:/state
      - ./local:/app/local:ro
      - ./logs:/logs
    stop_grace_period: 30s
